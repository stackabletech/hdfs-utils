---
apiVersion: zookeeper.stackable.tech/v1alpha1
kind: ZookeeperCluster
metadata:
  name: simple-zk
spec:
  image:
    productVersion: 3.9.4
    pullPolicy: IfNotPresent
  servers:
    roleGroups:
      default:
        replicas: 1
---
apiVersion: hdfs.stackable.tech/v1alpha1
kind: HdfsCluster
metadata:
  name: simple-hdfs
spec:
  image:
    productVersion: 3.4.2
    custom: oci.stackable.tech/sandbox/andrew/hadoop:3.4.2-stackable0.0.0-topprov
    pullPolicy: IfNotPresent
  clusterConfig:
    dfsReplication: 1
    zookeeperConfigMapName: simple-zk
    rackAwareness:
      - nodeLabel: kubernetes.io/hostname
      - podLabel: app.kubernetes.io/role-group
    authentication:
      tlsSecretClass: tls
      kerberos:
        secretClass: kerberos-default
  nameNodes:
    config:
      listenerClass: external-stable
      logging:
        enableVectorAgent: false
        containers:
          hdfs:
            console:
              level: DEBUG
            file:
              level: DEBUG
            loggers:
              ROOT:
                level: DEBUG
    configOverrides: &configOverrides
      core-site.xml:
        hadoop.user.group.static.mapping.overrides: "dr.who=;nn=;nm=;jn=;testuser=supergroup;"
    roleGroups:
      default:
        replicas: 2
  dataNodes:
    config:
      listenerClass: external-stable
    configOverrides: *configOverrides
    roleGroups:
      default:
        replicas: 3
  journalNodes:
    configOverrides: *configOverrides
    roleGroups:
      default:
        replicas: 1
